name: "octalweb-design-dev"

# Common defaults for services.
# Reused via "<<: *defaults" to avoid duplication.
x-defaults: &defaults
  restart: "no"
  init: true
  stop_grace_period: "5s"
  env_file:
    - "../.env"
  networks:
    - "octalnet-design-dev"

services:
  # ========================================================================== #
  #                                Applications                                #
  # ========================================================================== #

  owd-app-web:
    <<: *defaults
    container_name: "owd-app-web"
    image: "octalmesh/owd-app-web"
    build:
      context: "../../.."
      dockerfile: "infra/dev/docker/Dockerfile"
    ports:
      - "${DESIGN_WEB_PORT:-5175}:${DESIGN_WEB_PORT:-5175}"
    volumes:
      - "../../../:/app"
      - "owd-node-modules:/app/node_modules"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${DESIGN_WEB_PORT:-5175}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s

# Dedicated isolated networks
networks:
  octalnet-design-dev:
    name: "octalnet-design-dev"

# Dedicated volumes for caching
volumes:
  owd-node-modules:
